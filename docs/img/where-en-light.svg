<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-labelledby="t d"><title id="t">What runs where</title><desc id="d">Phone, iPad and Mac (Heeler) reach herdr on the main PC over Tailscale. On the PC, Claude Code leads in herdr workspaces and hands work through lane to OpenCode and Command Code workers in a sandbox; when a session or worker finishes, the phone gets a push. Long jobs can go to a second machine.</desc><style>.bg{fill:#f6f8fa;stroke:#d1d9e0}.box{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.5}.acc{stroke:#0969da}.ok{stroke:#1a7f37}.sb{fill:none;stroke:#9a6700;stroke-dasharray:5 4}.dash{stroke-dasharray:5 4}.chip{fill:#f6f8fa;stroke:#d1d9e0}.tt{fill:#1f2328;font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.tm{fill:#59636e;font:9.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.ln{stroke:#59636e;stroke-width:1.5;fill:none}.lacc{stroke:#0969da}.lok{stroke:#1a7f37}.ah{fill:#0969da}.ahok{fill:#1a7f37}</style><rect class="bg" x="0.5" y="0.5" width="359" height="469" rx="12"/><rect class="box ok" x="10" y="10" width="340" height="54" rx="8"/><text class="tt" x="20" y="28">Phone · iPad · Mac — Heeler</text><text class="tm" x="20" y="43">watch · reply in Chat · approve · Ctrl+C</text><text class="tm" x="20" y="57">push when any Claude / worker finishes</text><line class="ln lok" x1="120" y1="108" x2="120" y2="70"/><polygon class="ahok" points="116,71 124,71 120,64"/><text class="tm" x="128" y="90">done → push</text><line class="ln lacc" x1="240" y1="64" x2="240" y2="102"/><polygon class="ah" points="236,101 244,101 240,108"/><text class="tm" x="248" y="84">Tailscale</text><text class="tm" x="248" y="97">(private network, SSH)</text><rect class="box acc" x="10" y="108" width="340" height="292" rx="10"/><text class="tt" x="22" y="127">Main PC · Windows + WSL</text><rect class="box" x="22" y="136" width="316" height="34" rx="6"/><text class="tt" x="32" y="157">herdr</text><rect class="chip" x="78" y="143" width="72" height="20" rx="10"/><text class="tm" x="114" y="157" text-anchor="middle">project-a</text><rect class="chip" x="158" y="143" width="72" height="20" rx="10"/><text class="tm" x="194" y="157" text-anchor="middle">project-b</text><rect class="chip" x="238" y="143" width="72" height="20" rx="10"/><text class="tm" x="274" y="157" text-anchor="middle">lanes</text><rect class="box acc" x="22" y="184" width="150" height="58" rx="8"/><text class="tt" x="32" y="202">Claude Code (lead)</text><text class="tm" x="32" y="217">plans · splits · writes briefs</text><text class="tm" x="32" y="231">reads diffs · tests + mutants</text><rect class="box " x="188" y="184" width="150" height="58" rx="8"/><text class="tt" x="198" y="202">lane</text><text class="tm" x="198" y="217">worktree · ledger</text><text class="tm" x="198" y="231">accept · merge</text><line class="ln lacc" x1="172" y1="213" x2="182" y2="213"/><polygon class="ah" points="181,209 188,213 181,217"/><line class="ln lacc" x1="263" y1="242" x2="263" y2="262"/><polygon class="ah" points="259,261 267,261 263,268"/><rect class="box sb" x="22" y="268" width="316" height="120" rx="8"/><text class="tm" x="32" y="285">sandbox (bubblewrap): no keys · no git · own folder only</text><rect class="box ok" x="32" y="296" width="92" height="52" rx="8"/><text class="tt" x="42" y="314">oc-worker-01</text><text class="tm" x="42" y="329">OpenCode</text><text class="tm" x="42" y="343">DeepSeek</text><rect class="box ok" x="134" y="296" width="92" height="52" rx="8"/><text class="tt" x="144" y="314">oc-worker-02</text><text class="tm" x="144" y="329">OpenCode</text><text class="tm" x="144" y="343">DeepSeek</text><rect class="box ok" x="236" y="296" width="92" height="52" rx="8"/><text class="tt" x="246" y="314">cc-worker-03</text><text class="tm" x="246" y="329">Command Code</text><text class="tm" x="246" y="343">DeepSeek</text><text class="tm" x="32" y="374">when done: REPORT.md + LANE_RESULT.json → Claude checks</text><line class="ln dash" x1="180" y1="400" x2="180" y2="420"/><rect class="box dash" x="10" y="420" width="340" height="42" rx="8"/><text class="tt" x="22" y="438">Second machine (optional)</text><text class="tm" x="22" y="453">long tests · builds · grids — nice 19, rsync there and back</text></svg>
