<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-labelledby="t d"><title id="t">Neyi nerede kullanırsın</title><desc id="d">Telefon, iPad ve Mac (Heeler) Tailscale üzerinden ana PC'deki herdr'a bağlanır. PC'de lider Claude Code herdr workspace'lerinde çalışır ve işi lane ile sandbox içindeki OpenCode ve Command Code işçilerine verir; oturum ya da işçi bitince telefona push gelir. Uzun işler ikinci makineye gidebilir.</desc><style>.bg{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#30363d;stroke-width:1.5}.acc{stroke:#58a6ff}.ok{stroke:#3fb950}.sb{fill:none;stroke:#d29922;stroke-dasharray:5 4}.dash{stroke-dasharray:5 4}.chip{fill:#161b22;stroke:#30363d}.tt{fill:#e6edf3;font:600 11px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.tm{fill:#8b949e;font:9.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.ln{stroke:#8b949e;stroke-width:1.5;fill:none}.lacc{stroke:#58a6ff}.lok{stroke:#3fb950}.ah{fill:#58a6ff}.ahok{fill:#3fb950}</style><rect class="bg" x="0.5" y="0.5" width="359" height="469" rx="12"/><rect class="box ok" x="10" y="10" width="340" height="54" rx="8"/><text class="tt" x="20" y="28">Telefon · iPad · Mac — Heeler</text><text class="tm" x="20" y="43">izle · Chat'ten cevap yaz · onay ver · Ctrl+C</text><text class="tm" x="20" y="57">her Claude / işçi bitince push</text><line class="ln lok" x1="120" y1="108" x2="120" y2="70"/><polygon class="ahok" points="116,71 124,71 120,64"/><text class="tm" x="128" y="90">bitti → push</text><line class="ln lacc" x1="240" y1="64" x2="240" y2="102"/><polygon class="ah" points="236,101 244,101 240,108"/><text class="tm" x="248" y="84">Tailscale</text><text class="tm" x="248" y="97">(özel ağ, SSH)</text><rect class="box acc" x="10" y="108" width="340" height="292" rx="10"/><text class="tt" x="22" y="127">Ana PC · Windows + WSL</text><rect class="box" x="22" y="136" width="316" height="34" rx="6"/><text class="tt" x="32" y="157">herdr</text><rect class="chip" x="78" y="143" width="72" height="20" rx="10"/><text class="tm" x="114" y="157" text-anchor="middle">proje-a</text><rect class="chip" x="158" y="143" width="72" height="20" rx="10"/><text class="tm" x="194" y="157" text-anchor="middle">proje-b</text><rect class="chip" x="238" y="143" width="72" height="20" rx="10"/><text class="tm" x="274" y="157" text-anchor="middle">lanes</text><rect class="box acc" x="22" y="184" width="150" height="58" rx="8"/><text class="tt" x="32" y="202">Claude Code (lider)</text><text class="tm" x="32" y="217">planlar · böler · brief yazar</text><text class="tm" x="32" y="231">diff okur · test + mutant</text><rect class="box " x="188" y="184" width="150" height="58" rx="8"/><text class="tt" x="198" y="202">lane</text><text class="tm" x="198" y="217">worktree · defter</text><text class="tm" x="198" y="231">accept · merge</text><line class="ln lacc" x1="172" y1="213" x2="182" y2="213"/><polygon class="ah" points="181,209 188,213 181,217"/><line class="ln lacc" x1="263" y1="242" x2="263" y2="262"/><polygon class="ah" points="259,261 267,261 263,268"/><rect class="box sb" x="22" y="268" width="316" height="120" rx="8"/><text class="tm" x="32" y="285">sandbox (bubblewrap): anahtar yok · git yok · sadece kendi klasörü</text><rect class="box ok" x="32" y="296" width="92" height="52" rx="8"/><text class="tt" x="42" y="314">oc-worker-01</text><text class="tm" x="42" y="329">OpenCode</text><text class="tm" x="42" y="343">DeepSeek</text><rect class="box ok" x="134" y="296" width="92" height="52" rx="8"/><text class="tt" x="144" y="314">oc-worker-02</text><text class="tm" x="144" y="329">OpenCode</text><text class="tm" x="144" y="343">DeepSeek</text><rect class="box ok" x="236" y="296" width="92" height="52" rx="8"/><text class="tt" x="246" y="314">cc-worker-03</text><text class="tm" x="246" y="329">Command Code</text><text class="tm" x="246" y="343">DeepSeek</text><text class="tm" x="32" y="374">bitince: REPORT.md + LANE_RESULT.json → Claude kontrol e